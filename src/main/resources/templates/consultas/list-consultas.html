<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Consultas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Consultas Agendadas</h1>
        <div>
            <a href="/agenda" class="btn btn-secondary">Voltar para Agenda</a>
            <a href="/consultas/nova" class="btn btn-primary">Nova Consulta</a>
        </div>
    </div>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Data</th>
            <th>Paciente</th>
            <th>Médico</th>
            <th>Observações</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="consulta : ${consultas}">
            <td th:text="${consulta.id}"></td>
            <td th:text="${#dates.format(consulta.dataConsulta, 'dd/MM/yyyy')}"></td>
            <td th:text="${consulta.paciente}"></td>
            <td th:text="${consulta.medico.nome}"></td>
            <td th:text="${consulta.observacoes}"></td>
            <td>
                <a th:href="@{/consultas/editar/{id}(id=${consulta.id})}" class="btn btn-sm btn-warning">Editar</a>
                <a th:href="@{/consultas/excluir/{id}(id=${consulta.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Tem certeza que deseja excluir?');">Excluir</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
