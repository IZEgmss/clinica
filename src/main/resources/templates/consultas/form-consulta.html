<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Consulta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 th:if="${consulta.id == null}">Nova Consulta</h1>
    <h1 th:unless="${consulta.id == null}">Editar Consulta</h1>

    <form th:action="@{/consultas/salvar}" th:object="${consulta}" method="post">
        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label for="dataConsulta" class="form-label">Data da Consulta:</label>
            <input type="date" id="dataConsulta" th:field="*{dataConsulta}" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label for="paciente" class="form-label">Nome do Paciente:</label>
            <input type="text" id="paciente" th:field="*{paciente}" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label for="observacoes" class="form-label">Observações:</label>
            <textarea id="observacoes" th:field="*{observacoes}" class="form-control"></textarea>
        </div>
        <div class="mb-3">
            <label for="medico" class="form-label">Médico:</label>
            <select id="medico" th:field="*{medico.id}" class="form-select" required>
                <option value="">Selecione um médico</option>
                <option th:each="medico : ${medicos}"
                        th:value="${medico.id}"
                        th:text="${medico.nome} + ' (' + ${medico.especialidade} + ')'"></option>
            </select>
        </div>
        <button type="submit" class="btn btn-success">Salvar</button>
        <a href="/consultas" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
