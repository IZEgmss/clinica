<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Agenda Completa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Agenda Completa da Clínica</h1>
        <div>
            <a href="/admin/dashboard" class="btn btn-info">Voltar para a Dashboard</a>
            <a href="/consultas" class="btn btn-primary">Gerenciar Consultas</a>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(agendas)}">
        <div class="alert alert-warning" role="alert">
            Nenhum médico ou consulta cadastrada.
        </div>
    </div>

    <div th:each="agenda : ${agendas}" class="card mb-4">
        <div class="card-header">
            <h5 class="mb-0" th:text="${agenda.nomeMedico} + ' - ' + ${agenda.especialidadeMedico}"></h5>
        </div>
        <div class="card-body">
            <div th:if="${#lists.isEmpty(agenda.consultas)}">
                <p>Nenhuma consulta agendada para este médico.</p>
            </div>
            <table class="table table-sm table-hover" th:unless="${#lists.isEmpty(agenda.consultas)}">
                <thead>
                <tr>
                    <th>Data</th>
                    <th>Paciente</th>
                    <th>Observações</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="consulta : ${agenda.consultas}">
                    <td th:text="${#dates.format(consulta.dataConsulta, 'dd/MM/yyyy')}"></td>
                    <td th:text="${consulta.paciente}"></td>
                    <td th:text="${consulta.observacoes}"></td>
                    <td>
                        <a th:href="@{/consultas/editar/{id}(id=${consulta.id})}" class="btn btn-sm btn-outline-warning">Ver/Editar</a>
                    </td>
                </tr>
                </tbody>
            </table>
            <a th:href="@{/consultas/nova}" class="btn btn-sm btn-success mt-2">Agendar Nova Consulta</a>
        </div>
    </div>
</div>
</body>
</html>
