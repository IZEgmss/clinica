<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Paciente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 th:if="${paciente.id == null}">Novo Paciente</h1>
    <h1 th:unless="${paciente.id == null}">Editar Paciente</h1>

    <form th:action="@{/pacientes/salvar}" th:object="${paciente}" method="post">
        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label for="nome" class="form-label">Nome:</label>
            <input type="text" id="nome" th:field="*{nome}" class="form-control" required/>
        </div>

        <div class="mb-3">
            <label for="cpf" class="form-label">CPF:</label>
            <input type="text" id="cpf" th:field="*{cpf}" class="form-control" required/>
        </div>

        <button type="submit" class="btn btn-success">Salvar</button>
        <a href="/pacientes" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
