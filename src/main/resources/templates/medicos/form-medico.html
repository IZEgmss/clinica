<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Médico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 th:if="${medico.id == null}">Novo Médico</h1>
    <h1 th:unless="${medico.id == null}">Editar Médico</h1>

    <form th:action="@{/medicos/salvar}" th:object="${medico}" method="post">
        <input type="hidden" th:field="*{id}"/>
        <div class="mb-3">
            <label for="nome" class="form-label">Nome:</label>
            <input type="text" id="nome" th:field="*{nome}" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label for="especialidade" class="form-label">Especialidade:</label>
            <input type="text" id="especialidade" th:field="*{especialidade}" class="form-control" required/>
        </div>
        <button type="submit" class="btn btn-success">Salvar</button>
        <a href="/medicos" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
