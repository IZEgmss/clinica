<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Exame</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 th:if="${exame.id == null}">Novo Exame</h1>
    <h1 th:unless="${exame.id == null}">Editar Exame</h1>

    <form th:action="@{/exames/salvar}" th:object="${exame}" method="post">
        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label for="nome" class="form-label">Nome do Exame:</label>
            <input type="text" id="nome" th:field="*{nome}" class="form-control" required placeholder="Ex: Hemograma"/>
        </div>

        <div class="mb-3">
            <label for="descricao" class="form-label">Descrição:</label>
            <textarea id="descricao" th:field="*{descricao}" class="form-control" rows="3"></textarea>
        </div>

        <div class="mb-3">
            <label for="paciente" class="form-label">Paciente:</label>
            <select id="paciente" name="paciente" class="form-select" required>
                <option value="">Selecione um paciente</option>
                <option th:each="p : ${pacientes}" 
                        th:value="${p.id}" 
                        th:text="${p.nome}" 
                        th:selected="${exame.paciente != null && p.id == exame.paciente.id}">
                    Nome do Paciente
                </option>
            </select>
        </div>

        <button type="submit" class="btn btn-success">Salvar</button>
        <a href="/exames" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
