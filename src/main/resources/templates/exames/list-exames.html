<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Exames</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Exames Cadastrados</h1>
        <div>
            <a href="/admin/dashboard" class="btn btn-secondary">Voltar para a Dashboard</a>
            <a href="/exames/novo" class="btn btn-primary">Novo Exame</a>
            <a href="/exames/lote" class="btn btn-info">Adicionar em Lote</a>
        </div>
    </div>

    <div th:if="${examesPorPaciente == null or examesPorPaciente.empty}" class="alert alert-info">
        Nenhum exame cadastrado.
    </div>

    <div th:each="entry : ${examesPorPaciente}" class="card mb-4">
        <div class="card-header bg-light">
            <h5 class="mb-0" th:text="${entry.key}">Nome do Paciente</h5>
        </div>
        <div class="card-body p-0">
            <table class="table table-striped mb-0">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Descrição</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="exame : ${entry.value}">
                    <td th:text="${exame.id}"></td>
                    <td th:text="${exame.nome}"></td>
                    <td th:text="${exame.descricao}"></td>
                    <td>
                        <a th:href="@{/exames/editar/{id}(id=${exame.id})}" class="btn btn-sm btn-warning">Editar</a>
                        <a th:href="@{/exames/excluir/{id}(id=${exame.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Tem a certeza que deseja excluir?');">Excluir</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
